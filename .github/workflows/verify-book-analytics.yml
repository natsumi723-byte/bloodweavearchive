name: Verify book analytics

on:
  push:
    paths:
      - "books/**"
      - "analytics.js"
      - "scripts/verify-book-analytics.mjs"
      - ".github/workflows/verify-book-analytics.yml"
  pull_request:
    paths:
      - "books/**"
      - "analytics.js"
      - "scripts/verify-book-analytics.mjs"
      - ".github/workflows/verify-book-analytics.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-book-analytics.mjs
